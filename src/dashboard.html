<body>
<main>
  <header>
    <div>
      <h1 id="name">autoresearch</h1>
      <div class="sub" id="metricinfo"></div>
    </div>
    <div class="spacer"></div>
    <span class="pill running" id="running" hidden><span class="beat" id="beat"></span><code id="runcmd"></code><span class="num" id="elapsed">00:00</span></span>
    <span class="pill" id="conn"><span class="dot"></span><span id="conntext">connecting</span></span>
  </header>
  <div class="note" id="segnote" hidden></div>
  <div id="content"><div class="empty">Loading…</div></div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// A run's "kind" refines its logged status: the baseline and neutral keeps (simplifications:
// kept for being simpler, not for a gain) are keeps, an unconfirmed keep is a discard that
// carries a note (the plugin measured it against HEAD and reverted it).
const KIND_LABEL = { baseline: "baseline", keep: "kept", neutral: "kept (simpler)", discard: "discarded", unconfirmed: "not confirmed", crash: "crash", checks_failed: "checks failed" };
const KIND_VAR = { baseline: "--accent", keep: "--keep", neutral: "--keep", discard: "--discard", unconfirmed: "--discard", crash: "--crash", checks_failed: "--checks" };

// ---------- helpers ----------
function h(tag, attrs, ...kids) {

function svg(tag, attrs) {

  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  return el;
}
const isNum = (x) => typeof x === "number" && Number.isFinite(x);
// Integers and short decimals are shown exactly; anything longer is cut to 6 significant digits.
function fmt(x) {
  if (!isNum(x)) return "—";
  if (Number.isInteger(x)) return String(x);
  if (Math.abs(x) >= 1e6) return String(Math.round(x));
  return String(Number(x.toPrecision(6)));
}
// Percentages are always shown without a sign: "12.5% better" / "3.1% worse" (gains) or a
// plain level ("87.5%"). A signed delta reads differently for lower- and higher-is-better.
function fmtPctNum(p) {
  const abs = Math.abs(p);

  // 9.999… reads "10.0%", not "10.00%"). Then add decimals until the rounded text is no
  // longer zero, so a small change never reads "0.00%".

}
// Below this a gain counts as zero: no wording, no colour.
const gainZero = (g) => g == null || Math.abs(g) < 0.0000005;
// g = fraction better (negative = worse), already direction-aware.
function gainText(g) {
  if (g == null) return "—";
  if (gainZero(g)) return "no change";
  return fmtPctNum(g * 100) + (g > 0 ? " better" : " worse");
}
const gainClass = (g) => (gainZero(g) ? "" : g > 0 ? "good" : "bad");
const gainOf = (ratio, dir) => (dir === "higher" ? ratio - 1 : 1 - ratio);
// The other way round: a gain (fraction better) as the ratio candidate / HEAD.
const ratioOf = (gain, dir) => (dir === "higher" ? 1 + gain : 1 - gain);
// A level in words, in the metric's own direction: 0.81 → "19.0% lower", 1.21 → "21.0% higher"
// (than the baseline). `worse` = the level is on the wrong side for the direction.
function levelWords(level, dir) {
  if (!isNum(level)) return { text: "—", worse: false };
  if (gainZero(level - 1)) return { text: "no change", worse: false };
  const lower = level < 1;
  return { text: fmtPctNum((level - 1) * 100) + (lower ? " lower" : " higher"), worse: lower !== (dir !== "higher") };
}
// Levels sit close to 100%, so they always get one decimal ("81.0%", "104.4%", not "104%").
const levelText = (l) => (isNum(l) ? (l * 100).toFixed(1) + "%" : "—");
// p-values: "p = 0.004", "p = 0.21", "p < 0.001"; and the same in plain words.
const pText = (p) => (p < 0.001 ? "p < 0.001" : "p = " + (p >= 0.1 ? p.toFixed(2) : p.toFixed(3)));
function luckText(p) {
  const how = p < 0.001 ? "under 0.1%" : p < 0.01 ? "under 1%" : "about " + Math.round(p * 100) + "%";
  return "chance this is luck: " + how;
}
const SLOW_TAG = "no statistical check (slow mode)";
const SLOW_TITLE = "Slow mode (repeat below 3): a keep is decided on a few HEAD/candidate pairs without a statistical test, so a kept change can be luck.";
const isSlow = (config) => config.mode === "slow" || (isNum(config.repeat) && config.repeat < 3);
function fmtX(c) {
  const t = Math.abs(c) >= 100 ? c.toFixed(0) : c.toFixed(1);
  return (Number(t) === 0 ? "0.0" : t) + "×"; // never "-0.0×"
}
// Free-form note values are shown as written; only figures (metrics) get rounded.
function valText(v, round) {
  if (v == null) return "null";
  if (typeof v === "string") return v;
  if (typeof v === "number") return round ? fmt(v) : String(v);
  try { return JSON.stringify(v, null, 2); } catch { return String(v); }
}
function mmss(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = (n) => String(n).padStart(2, "0");
  return (hh ? hh + ":" + p(mm) : p(mm)) + ":" + p(ss);
}
const numList = (x) => (Array.isArray(x) ? x.filter(isNum) : []);
const numSamples = (r) => numList(r.samples);
// [[head, candidate], …] with two numbers each; anything else is dropped.
const pairList = (x) => (Array.isArray(x) ? x.filter((q) => Array.isArray(q) && q.length === 2 && isNum(q[0]) && isNum(q[1])) : []);
// One pair's result: how much better the candidate run was than the HEAD run next to it,
// as a fraction of the HEAD run (the plugin's rule). null when HEAD measured 0.
const pairGain = (q, dir) => (q[0] !== 0 ? (dir === "higher" ? q[1] - q[0] : q[0] - q[1]) / Math.abs(q[0]) : null);
const pairGains = (pairs, dir) => pairs.map((q) => pairGain(q, dir)).filter(isNum);
function median(xs) {
  const s = [...xs].sort((a, b) => a - b), mid = s.length >> 1;
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}
// One short id for "the benchmark" of a segment: the first 7 characters of the hash of
// .auto/measure.sh, plus (v0.2.1) "+" and the first 4 of inputs_hash, the hash over the other
// frozen files under .auto/ (inputs_hash does not cover measure.sh or checks.sh).
const hashStr = (x) => (typeof x === "string" && x ? x : null);
function benchId(config) {
  const m = hashStr(config.measure_hash), i = hashStr(config.inputs_hash);
  if (!m && !i) return null;
  return (m ? m.slice(0, 7) : "?") + (i ? "+" + i.slice(0, 4) : "");
}
// Different when any of the three hashes differs. Each is compared only when both segments
// have it (a segment from before v0.2.1 has no inputs_hash), so "unknown" never reads as different.
function sameBench(a, b) {
  for (const k of ["measure_hash", "checks_hash", "inputs_hash"]) {
    if (hashStr(a[k]) && hashStr(b[k]) && a[k] !== b[k]) return false;
  }
  // checks.sh added or removed (null on one side, a hash on the other) is a different benchmark too.
  if ("checks_hash" in a && "checks_hash" in b && Boolean(hashStr(a.checks_hash)) !== Boolean(hashStr(b.checks_hash))) return false;
  return true;
}

// ---------- state ----------
let model = null;            // { segments: [{ config, runs }] } in log order; the last one is the live segment
let selectedSeg = null;      // segment id the user picked; null = follow the latest segment
const expanded = new Set();  // "segment:run" keys whose detail row is open (survives re-renders)
let chartMode = "level";     // "level" (relative, the honest default) or "raw" (values as measured); survives re-renders
let fetchSeq = 0;
let logText = null;          // the log as last rendered: an unchanged log is not rendered again
let dataVersion = 0;         // goes up whenever the model changes; part of the chart's draw key
let renderPending = false;   // the log changed while the tab was hidden; render when it shows again

function parseLog(text) {
  const segments = [], byId = new Map();
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    let e;
    try { e = JSON.parse(line); } catch { continue; } // skip unparsable lines
    if (!e || typeof e !== "object") continue;
    if (e.type === "config") {
      // Each config entry starts a segment (a fixed benchmark + repeat); runs join the segment they name.
      const seg = { config: e, runs: [] };
      if (byId.has(e.segment)) segments.splice(segments.indexOf(byId.get(e.segment)), 1);
      byId.set(e.segment, seg);
      segments.push(seg);
    } else if (e.type === "run" && byId.has(e.segment)) {
      byId.get(e.segment).runs.push(e);
    }
  }
  return { segments };
}

async function loadLog() {
  const seq = ++fetchSeq;
  let text = null;
  try {
    const res = await fetch("/log.jsonl", { cache: "no-store" });
    text = res.ok ? await res.text() : "";
  } catch { /* keep what is shown */ }
  if (seq !== fetchSeq) return; // a newer fetch started; drop this stale one
  if (text === null) {
    if (model) return;
    text = "";
  } else if (model && text === logText) {
    return; // nothing new (every reconnect re-fetches): leave the page alone
  }
  logText = text;
  model = parseLog(text);
  dataVersion++;
  requestRender();
}
// A hidden tab does no rendering at all; it catches up when it is shown.
function requestRender() {
  if (document.hidden) { renderPending = true; return; }
  renderPending = false;
  render();
}

// Everything the views need to know about one segment's runs.
//   baseline = the run flagged baseline (old logs: the first keep with a metric)
//   current  = the last keep (it describes HEAD); NOT the best value: a simplification may be slightly worse
//   kind     = refined status per run
//
// Machine speed drifts within minutes, so values logged at different times are NOT comparable.
// Progress therefore comes only from paired results (the same rules as compaction.ts, analyze()):
//   pair     = per run, what it was compared with.
//              v0.2.2 entries (they carry `gain` or `pairs`): refKind "pairs",
//                gain = `gain`, the median relative difference of the HEAD/candidate pairs
//                measured back to back (recomputed from `pairs` when missing), p = `p`,
//                diffs / lookDiffs = each pair's difference (decision pairs / first look)
//              older entries: { cand, ref, refKind, ratio, gain } with cand = the run's metric,
//                ref = `vs`, else the median of `current_samples`, else (before v0.2) the metric
//                of the keep before it; refKind = "paired" (HEAD re-measured alongside),
//                "logged" (v0.2.0: current's logged value) or "previous"
//              gain is always a fraction, positive = better in the segment's direction
//   level    = the product of r over the confirmed keeps, r = candidate / HEAD of each keep
//              (lower is better: 1 − gain, the gain being the reduction; higher is better:
//              1 + gain; older keeps: cand / ref). 1 = the baseline, and the level is in the
//              METRIC'S OWN DIRECTION: two 10 % reductions of a lower-is-better metric give
//              0.81 ("19 % lower", the line goes DOWN), two 10 % increases of a
//              higher-is-better one 1.21. (The product of 1 + gain said 21 % for both.)
//              The same rule as compoundedLevel() in state.ts and analyze() in compaction.ts.
//              The baseline is no change, and a simplification keep counts as no change (it
//              was kept for being simpler; its measured difference is noise).
//   gain     = the level as a fraction better than the baseline (for the colour only)
//   levelAt  = level before a run; levelAfter = level after a keep
//   kept     = keeps without the baseline; measured = those that went into the level;
//   simpler  = simplification keeps
function analyze(seg) {
  const { config, runs } = seg;
  const dir = config.direction === "higher" ? "higher" : "lower";
  const keeps = runs.filter((r) => r.status === "keep" && isNum(r.metric));
  const baseRun = keeps.find((r) => r.baseline === true) || keeps[0] || null;
  const curRun = keeps.length ? keeps[keeps.length - 1] : null;

  let product = 1; // of each confirmed keep's ratio candidate / HEAD
  let kept = 0, measured = 0, simpler = 0;
  const levelNow = () => product;

    let k = String(r.status);
    if (r === baseRun) k = "baseline";
    else if (r.status === "keep" && r.neutral === true) k = "neutral";
    else if (r.status === "discard" && r.note) k = "unconfirmed";
    kind.set(r, k);
    levelAt.set(r, levelNow());
    // Only decided proposals carry a paired result: keeps, and unconfirmed keeps with a logged
    // gain. A run that crashed or failed checks mid-decision keeps its partial pairs in the log,
    // but they are no result (recomputing a gain from them showed a crash as "13.6 % better").
    if (r !== baseRun && r.status !== "crash" && r.status !== "checks_failed") {
      const pairs = pairList(r.pairs);
      if (isNum(r.gain) || (r.status === "keep" && pairs.length)) {
        const diffs = pairGains(pairs, dir);
        const gain = isNum(r.gain) ? r.gain : diffs.length ? median(diffs) : null;

          refKind: "pairs", gain, ratio: ratioOf(gain, dir), p: isNum(r.p) ? r.p : null, n: pairs.length, pairs, diffs,

      }

      if (r !== baseRun) {

}
const REF_LABEL = { pairs: "HEAD alongside", paired: "HEAD alongside", logged: "current as logged", previous: "the keep before" };
// The paired result is shown for keeps and for keeps the plugin did not confirm.
function shownPair(r, a) {
  const k = a.kind.get(r), p = a.pair.get(r);
  if (!p) return null;
  if (k === "keep" || k === "neutral") return p;
  return k === "unconfirmed" && (p.refKind === "paired" || p.refKind === "pairs") ? p : null;
}
const pairsText = (n) => (n ? `${n} pair${n === 1 ? "" : "s"}` : "");

// How the plugin's decision on ONE run is shown: { text, cls, title } or null (not a decision).
// Whether a result was enough is the plugin's decision and is read from the status
// (keep = confirmed), never from a threshold here.
//
// v0.2.2 entries: "confirmed · p = 0.004". p is the exact one-sided p-value of the paired
// test; the title says it in plain words ("chance this is luck: under 1%"). Slow mode has
// no test, and says so. A simplification is never worded as a gain.
// Older entries: `confidence` (gain ÷ noise, v0.2.0 and v0.2.1), as before. Logs written
// before v0.2 stored a cumulative figure in `confidence`; that one is not shown.
function confInfo(r, a) {
  const k = a.kind.get(r), p = a.pair.get(r);
  if (k !== "keep" && k !== "neutral" && k !== "unconfirmed") return null;
  if (p && p.refKind === "pairs") {
    const tested = p.p != null;
    const luck = tested ? luckText(p.p) : SLOW_TITLE;
    if (k === "neutral") return {
      text: "kept (simpler, no measurable loss)", cls: "",
      title: "A simplification: kept because the code got simpler and the candidate was not measurably worse than HEAD. It counts as no change, not as a gain." + (tested ? "" : " " + SLOW_TITLE),
    };
    if (k === "unconfirmed") return { text: "not confirmed · " + (tested ? pText(p.p) : SLOW_TAG), cls: "warn", title: luck, luck: tested ? luck : null };
    return tested
      ? { text: "confirmed · " + pText(p.p), cls: "good", title: luck, luck }
      : { text: "kept · " + SLOW_TAG, cls: "warn", title: SLOW_TITLE };
  }
  if (k === "unconfirmed") return { text: (isNum(r.confidence) ? fmtX(r.confidence) + " · " : "") + "not confirmed", cls: "warn" };
  // (v0.1 runs had `samples` as a count, never a list, and no `vs` / `first_metric`.)
  const isNew = Array.isArray(r.samples) || isNum(r.vs) || isNum(r.first_metric);
  if (!isNew) return { text: "—", cls: "" };
  const tail = k === "neutral" ? " · neutral" : "";
  if (isNum(r.confidence)) {
    if (k === "neutral") return { text: fmtX(r.confidence) + tail, cls: "" }; // only has to be "not worse"
    return { text: fmtX(r.confidence) + " confirmed", cls: "good", title: "this run's gain ÷ measurement noise (how the plugin decided before v0.2.2)" };
  }
  const sm = numSamples(r), n = sm.length || (isNum(a.config.repeat) ? a.config.repeat : 0);
  if (n < 3) return { text: "no noise estimate" + tail, cls: "" };
  if (r.noise === 0 || (sm.length >= 3 && sm.every((v) => v === sm[0]))) return { text: "exact" + tail, cls: k === "neutral" ? "" : "good" };
  return { text: "—", cls: "" };
}

// ---------- rendering ----------
function render() {
  const segments = model.segments;
  const content = $("content");
  content.replaceChildren();
  const latest = segments[segments.length - 1] || null;
  if (selectedSeg != null && !segments.some((s) => s.config.segment === selectedSeg)) selectedSeg = null;
  const seg = selectedSeg == null ? latest : segments.find((s) => s.config.segment === selectedSeg);
  renderSegNote(segments, seg, latest);

  if (!seg) {
    $("name").textContent = "autoresearch";
    $("metricinfo").textContent = "";
    document.title = "autoresearch";
    content.append(h("div", { class: "card empty" }, "No experiments yet"));
    return;
  }
  const a = analyze(seg), config = seg.config;
  a.isLatest = seg === latest;
  $("name").textContent = config.name || "autoresearch";
  document.title = (config.name || "autoresearch") + " · autoresearch";
  const info = [`${config.metric_name || "metric"}${config.metric_unit ? " (" + config.metric_unit + ")" : ""}`, `${a.dir} is better`];
  if (isNum(config.repeat)) info.push("repeat " + config.repeat);
  const bench = benchId(config);
  const benchTitle = hashStr(config.inputs_hash)
    ? "hash of .auto/measure.sh (first 7 characters) + hash of the other frozen files under .auto/ (first 4): everything except log.jsonl, ideas.md, config.json and prompt.md. A different id = a different benchmark."
    : "first 7 characters of the hash of .auto/measure.sh";
  const mi = $("metricinfo");
  mi.replaceChildren(info.join(" · "));
  if (bench) mi.append(" · benchmark ", h("span", { class: "mono", id: "bench", title: benchTitle }, bench));
  if (a.slow) mi.append(" ", h("span", { class: "tag", id: "slowtag", title: SLOW_TITLE }, SLOW_TAG));

  if (!seg.runs.length) {
    content.append(h("div", { class: "card empty" }, "No experiments yet"));
    return;
  }
  content.append(renderStats(a), renderChartCard(a), renderTable(a));
  drawChart(a);
}
// Clicking a segment button or the chart toggle.
function rerender() { render(); }

// "N earlier segments hidden" plus buttons to look at them. Segments are numbered by position in the log.
function renderSegNote(segments, seg, latest) {
  const el = $("segnote");
  el.replaceChildren();
  el.hidden = segments.length < 2;
  if (el.hidden) return;
  const n = segments.length - 1, idx = segments.indexOf(seg);
  let text = `${n} earlier segment${n > 1 ? "s" : ""} hidden`;
  if (seg !== latest) {
    text = `Viewing earlier segment ${idx + 1} of ${segments.length} (not the current one)`;
    if (!sameBench(seg.config, latest.config)) text += " · different benchmark, not comparable with the current segment";
  }
  const buttons = segments.map((s, i) => {
    const hash = benchId(s.config);
    return h("button", {
      type: "button", "aria-pressed": String(s === seg), "data-seg": String(i + 1),
      onclick: () => { selectedSeg = s === latest ? null : s.config.segment; rerender(); },
    }, `Segment ${i + 1}` + (s === latest ? " (current)" : ""), hash ? " · " : null, hash ? h("code", {}, hash) : null,
      isSlow(s.config) ? h("span", { class: "warn", title: SLOW_TITLE }, " · slow mode") : null);
  });
  el.append(h("span", { id: "segtext" }, text), h("span", { class: "segs" }, buttons));
}

function stat(k, v, d, cls, title) {
  return h("div", { class: "stat", title }, h("div", { class: "k" }, k), h("div", { class: "v " + (cls || "") }, v), h("div", { class: "d" }, d || " "));
}

const THEN = "As measured at the time. Machine speed drifts, so values from different times aren't comparable.";
function renderStats(a) {
  const { runs, baseRun, curRun, config, kind } = a;
  const unit = config.metric_unit ? " " + config.metric_unit : "";
  const baseline = baseRun ? baseRun.metric : null, current = curRun ? curRun.metric : null;
  const count = (k) => runs.filter((r) => kind.get(r) === k).length;
  const neutral = count("neutral"), unconf = count("unconfirmed"), disc = count("discard") + unconf;
  // "kept" never includes the baseline: it is a measurement, not a change.
  const breakdown = `${a.kept} kept${neutral ? ` (${neutral} simpler)` : ""} · ${disc} discarded${unconf ? ` (${unconf} not confirmed)` : ""} · ${count("crash")} crashed · ${count("checks_failed")} checks failed`;

  // Improvement = the level against the baseline, in the metric's own direction ("19.0% lower"):
  // the confirmed keeps compounded, each against HEAD measured alongside it.
  // Simplification keeps are not in it.
  const lw = a.gain == null ? { text: "—", worse: false } : levelWords(a.level, a.dir);
  const than = lw.text === "no change" ? "from the baseline" : "than the baseline" + (lw.worse ? " (worse)" : "");
  const simplerText = a.simpler ? `${a.simpler} simplification${a.simpler > 1 ? "s" : ""} not counted` : "";
  const impSub = !a.kept ? "no kept change yet"
    : !a.measured ? (a.simpler === a.kept ? "simplifications only: no gain counted" : "kept runs carry no comparison")
    : `${than} · ${a.measured} confirmed keep${a.measured > 1 ? "s" : ""}, compounded` + (simplerText ? " · " + simplerText : "");
  const impTitle = `Compounded result of the confirmed keeps: each kept run's ratio to HEAD measured right alongside it (candidate ÷ HEAD), multiplied together, so two 10% reductions read 19% lower. ${a.dir === "higher" ? "Higher" : "Lower"} is better for this metric. A simplification keep counts as no change. Not current ÷ baseline: raw numbers from different times aren't comparable.`;

  // Last keep: that keep's own result against HEAD measured alongside it.
  const last = curRun && curRun !== baseRun ? curRun : null;
  let lastCard;
  if (last) {
    const p = a.pair.get(last), c = confInfo(last, a), simple = kind.get(last) === "neutral";
    lastCard = simple
      ? stat("Last keep", "simpler", `run #${last.run} · no measurable loss · not counted as a gain`, "", c && c.title)
      : stat("Last keep", gainText(p ? p.gain : null), `run #${last.run} vs ${p ? REF_LABEL[p.refKind] : "previous state"} · ${c ? c.text : "—"}`, p ? gainClass(p.gain) : "", c && c.title);
  } else {
    lastCard = stat("Last keep", "—", baseRun ? "no keep since the baseline" : "no kept run yet");
  }
  return h("div", { class: "stats" },
    stat("Improvement", lw.text, impSub, gainClass(a.gain), impTitle),
    stat("Baseline", fmt(baseline) + (baseline != null ? unit : ""), baseRun ? `run #${baseRun.run} · as measured then` : "no kept run yet", "", THEN),
    stat("Current", fmt(current) + (current != null ? unit : ""), !curRun ? " " : (curRun === baseRun ? "baseline" : "run #" + curRun.run) + (a.isLatest ? " · HEAD" : " · end of segment") + " · as measured then", "", THEN),
    stat("Runs", String(runs.length), breakdown, "", "kept doesn't count the baseline"),
    lastCard,
  );
}

// One marker shape per kind, shared by the chart and its legend.
function marker(kind, cx, cy, small) {
  if (small) {
    // A run without a measurement of its own level: same shape, smaller.
    const g = svg("g", { transform: `translate(${cx},${cy}) scale(.7)` });
    g.append(marker(kind, 0, 0));
    return g;
  }
  const c = `var(${KIND_VAR[kind] || "--discard"})`, panel = "var(--panel)";
  switch (kind) {
    case "baseline": return svg("path", { d: `M${cx},${cy - 6}L${cx + 6},${cy}L${cx},${cy + 6}L${cx - 6},${cy}Z`, fill: c, stroke: panel, "stroke-width": 1 });
    case "keep": return svg("circle", { cx, cy, r: 4.5, fill: c, stroke: panel, "stroke-width": 1 });
    case "neutral": return svg("circle", { cx, cy, r: 4, fill: panel, stroke: c, "stroke-width": 2 });
    case "unconfirmed": return svg("path", { d: `M${cx},${cy - 5}L${cx + 5},${cy + 4}L${cx - 5},${cy + 4}Z`, fill: panel, stroke: c, "stroke-width": 1.8, "stroke-linejoin": "round" });
    case "crash": return svg("path", { d: `M${cx - 4},${cy - 4}L${cx + 4},${cy + 4}M${cx + 4},${cy - 4}L${cx - 4},${cy + 4}`, stroke: c, "stroke-width": 2.2, fill: "none" });
    case "checks_failed": return svg("rect", { x: cx - 3.5, y: cy - 3.5, width: 7, height: 7, fill: c, stroke: panel, "stroke-width": 1 });
    default: return svg("circle", { cx, cy, r: 3.5, fill: c, stroke: panel, "stroke-width": 1 });
  }
}

function renderChartCard(a) {
  const level = chartMode === "level";
  const item = (kind) => {
    const s = svg("svg", { width: 14, height: 14, viewBox: "0 0 14 14", "aria-hidden": "true" });
    s.append(marker(kind, 7, 7));
    return h("span", {}, s, KIND_LABEL[kind]);
  };
  const line = (style, label) => h("span", {}, h("span", { style: "display:inline-block;" + style }), label);
  const points = chartPoints(a);
  const better = a.dir === "higher" ? "higher is better" : "lower is better";
  const legend = h("div", { class: "legend" },
    ...["baseline", "keep", "neutral", "unconfirmed", "discard", "crash", "checks_failed"].map(item),
    line("width:14px;border-top:2px solid var(--keep)", level ? `current level (${better})` : "current"),
    line("width:14px;border-top:1px dashed var(--muted)", level ? "baseline (100%)" : "baseline level"),
    points.some((p) => p.sp) ? line("height:12px;border-left:2px solid var(--muted)", "sample range (min–max)") : null,
    points.some((p) => p.dots) ? line("width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.45", "one HEAD/candidate pair") : null,
    level && points.some((p) => p.small) ? h("span", { id: "smallnote" }, "small marker = not measured against HEAD, placed on the current level") : null);
  const mode = (m, label, title) => h("button", {
    type: "button", "aria-pressed": String(chartMode === m), "data-mode": m, title,
    onclick: () => { if (chartMode !== m) { chartMode = m; rerender(); } },
  }, label);
  const head = h("div", { class: "charthead" },
    h("span", { class: "sub", id: "chartcap" }, level
      ? `Level = the metric in % of the baseline (100%): each confirmed keep multiplies it by candidate ÷ HEAD measured alongside. ${better[0].toUpperCase() + better.slice(1)}.`
      : "Values as measured at the time. Machine speed drifts, so runs far apart aren't comparable."),
    h("span", { class: "segs", id: "chartmode" },
      mode("level", "Relative level", `baseline = 100%; each confirmed keep multiplies it by its ratio to HEAD measured alongside (candidate ÷ HEAD), so the line moves in the metric's own direction: ${a.dir === "higher" ? "up" : "down"} when the code gets better. Simplification keeps leave it unchanged. ${better[0].toUpperCase() + better.slice(1)}.`),
      mode("raw", "Measured values", "the raw medians and sample ranges, as logged")));
  return h("div", { class: "card" }, head, h("div", { id: "chart" }, h("div", { id: "tip" })), legend);
}

// What the chart plots, per mode. One entry per run:
//   y     = its value on the Y axis (null = pinned to the bottom edge, raw mode only)
//   sp    = [lo, hi] of its samples on the same axis, or null
//   dots  = level mode, v0.2.2 entries: one value per decision pair, so the spread shows
//   small = level mode: the run has no level of its own and sits on the current line
// Level mode is in percent of the baseline, in the metric's own direction (a lower-is-better
// segment goes DOWN from 100%): a keep sits at the level after it, an unconfirmed keep at
// the level before it × its own ratio (candidate ÷ HEAD), and every pair of either at the
// level before × that pair's ratio. A simplification keep stays
// on the line (it doesn't move the level); its pairs show how flat it really was.
// Raw mode plots the medians and sample ranges as logged, whatever the entry's version.
function chartPoints(a) {
  const level = chartMode === "level";
  const out = [];
  for (const r of a.runs) {
    if (!isNum(r.run)) continue;
    const sm = numSamples(r);
    let y = null, sp = null, dots = null, small = false, toY = null;
    if (level) {
      const p = a.pair.get(r), before = a.levelAt.get(r) * 100;
      if (p && p.refKind === "pairs" && r !== a.baseRun) {
        y = a.levelAfter.has(r) ? a.levelAfter.get(r) * 100 : before * p.ratio;
        if (p.diffs.length) dots = p.diffs.map((d) => before * ratioOf(d, a.dir));
      } else if (a.levelAfter.has(r)) {
        y = a.levelAfter.get(r) * 100;
        if (p && r !== a.baseRun) toY = (v) => before * (v / p.ref); // samples → level
      } else if (p && p.refKind === "paired") {
        toY = (v) => before * (v / p.ref);
        y = toY(p.cand);
      } else {
        y = before;
        small = true;
      }
    } else if (r.status !== "crash" && isNum(r.metric)) {
      // Crashes carry no usable metric (or a placeholder), and so does any run without a number
      // (e.g. checks_failed with metric null): they sit on the bottom edge and don't shape the Y range.
      y = r.metric;
      toY = (v) => v;
    }
    if (y != null && toY && sm.length > 1) {
      const e = [toY(Math.min(...sm)), toY(Math.max(...sm))], lo = Math.min(...e), hi = Math.max(...e);
      if (hi > lo) sp = [lo, hi];
    }
    out.push({ r, k: a.kind.get(r), y, sp, dots, small });
  }
  return out;
}

// "Nice" axis ticks (1, 2, 5 × 10^n).
function ticks(min, max, n) {
  const span = max - min, raw = span / Math.max(1, n);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) out.push(Number(v.toPrecision(12)));
  return out;
}

let chartArg = null, chartKey = "";
// Draws only when something it depends on changed (data, mode, segment or pixel width): a
// resize callback or a repeated call with the same inputs costs nothing.
function drawChart(a) {
  chartArg = a;
  const box = $("chart");
  if (!box) return;
  const W = Math.max(280, box.clientWidth - 16), H = W < 500 ? 200 : 260;
  const key = [dataVersion, chartMode, a.config.segment, W].join("|");
  if (key === chartKey && box.querySelector("svg")) return;
  chartKey = key;
  box.querySelector("svg")?.remove();
  const { baseRun, config } = a;
  const level = chartMode === "level";
  const pts = chartPoints(a);
  if (!pts.length) return;
  const baseline = level ? (baseRun ? 100 : null) : baseRun ? baseRun.metric : null;
  const m = { l: 56, r: 12, t: 10, b: 26 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;

  const scaled = pts.filter((p) => p.y != null).map((p) => p.y);
  if (!scaled.length && isNum(baseline)) scaled.push(baseline);
  let lo = scaled.length ? Math.min(...scaled) : 0, hi = scaled.length ? Math.max(...scaled) : 1;
  // Sample ranges widen the Y range, but by at most one metric span per side, so one wild
  // sample can't flatten the whole chart; longer whiskers are cut at the plot edge.
  const mlo = lo, mhi = hi, span = hi - lo;
  for (const p of pts) {
    if (p.sp) { lo = Math.min(lo, p.sp[0]); hi = Math.max(hi, p.sp[1]); }
    if (p.dots) { lo = Math.min(lo, ...p.dots); hi = Math.max(hi, ...p.dots); }
  }
  // (Level mode with nothing kept yet has no span of its own: then the pairs set the range.)
  // The pairs of a noisy segment spread far wider than its keeps move the level, and that
  // spread is what they are there to show: in level mode they may widen the range by 15
  // points per side. Anything beyond is drawn on the plot's edge, never dropped.
  const reach = level ? Math.max(span, 15) : span;
  if (span > 0 || level) { lo = Math.max(lo, mlo - reach); hi = Math.min(hi, mhi + reach); }
  if (hi === lo) { const pad = Math.abs(lo) * 0.05 || 1; lo -= pad; hi += pad; }
  const padY = (hi - lo) * 0.08; lo -= padY; hi += padY;
  const nums = pts.map((p) => p.r.run);
  let xlo = Math.min(...nums), xhi = Math.max(...nums);
  if (xhi === xlo) { xlo -= 1; xhi += 1; }
  const X = (v) => m.l + ((v - xlo) / (xhi - xlo)) * pw;
  const Y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * ph;
  const clampY = (y) => Math.min(m.t + ph, Math.max(m.t, y));

  const s = svg("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "data-mode": chartMode, "aria-label": level ? `level in percent of the baseline per run, ${a.dir === "higher" ? "higher" : "lower"} is better` : "measured value per run" });
  for (const t of ticks(lo, hi, H < 220 ? 4 : 5)) {
    s.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: "var(--line)" }));
    const tx = svg("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }); tx.textContent = fmt(t) + (level ? "%" : ""); s.append(tx);
  }
  const xt = ticks(xlo, xhi, Math.max(2, Math.floor(pw / 60))).filter((v) => Number.isInteger(v));
  for (const t of xt) {
    const tx = svg("text", { x: X(t), y: H - 8, "text-anchor": "middle" }); tx.textContent = "#" + t; s.append(tx);
  }
  s.append(svg("line", { x1: m.l, x2: W - m.r, y1: m.t + ph, y2: m.t + ph, stroke: "var(--muted)", "stroke-opacity": ".4" }));
  if (isNum(baseline)) s.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(baseline), y2: Y(baseline), stroke: "var(--muted)", "stroke-dasharray": "4 4" }));

  // Step line = current: starts at the baseline and moves at EVERY later keep, also when a
  // neutral keep is slightly worse (current is the last keep, not the best value).
  const basePt = pts.find((p) => p.r === baseRun);
  if (basePt) {
    let d = `M${X(baseRun.run)},${Y(baseline)}`;
    for (const p of pts.slice(pts.indexOf(basePt) + 1)) {
      if (p.r.status === "keep" && isNum(p.r.metric)) d += `H${X(p.r.run)}V${Y(p.y)}`;
    }
    d += `H${X(pts[pts.length - 1].r.run)}`;
    s.append(svg("path", { id: "curline", d, fill: "none", stroke: "var(--keep)", "stroke-width": 2, "stroke-opacity": ".75" }));
  }

  // Whiskers (min–max of the samples) go under the markers.
  for (const p of pts) {
    if (!p.sp) continue;
    const cx = X(p.r.run), t1 = Y(p.sp[1]), t2 = Y(p.sp[0]), y1 = clampY(t1), y2 = clampY(t2);
    const color = `var(${KIND_VAR[p.k] || "--discard"})`;
    // An end cut at the plot edge gets no cap, so it doesn't read as the real min/max.
    const d = `M${cx},${y1}V${y2}` + (y1 === t1 ? `M${cx - 3},${y1}h6` : "") + (y2 === t2 ? `M${cx - 3},${y2}h6` : "");
    s.append(svg("path", { class: "whisker", d, stroke: color, "stroke-width": 1.2, "stroke-opacity": ".8", fill: "none" }));
  }

  // Each decision pair of a run as a faint dot beside its marker (level mode): where that
  // one pair alone would have put the level. A pair beyond the plot sits on its edge.
  for (const p of pts) {
    if (!p.dots) continue;
    const cx = X(p.r.run), color = `var(${KIND_VAR[p.k] || "--discard"})`, n = p.dots.length;
    p.dots.forEach((v, i) => {
      const y = clampY(Y(v));
      // Spread sideways in measurement order, so dots at the same height stay countable.
      const dx = n > 1 ? (i / (n - 1) - 0.5) * Math.min(14, 2.2 * n) : 0;
      s.append(svg("circle", { class: "pairdot", cx: cx + dx, cy: y, r: 2, fill: color, "fill-opacity": ".38" }));
    });
  }

  const tip = $("tip");
  const unit = config.metric_unit ? " " + config.metric_unit : "";
  for (const p of pts) {
    const { r, k } = p, pin = p.y == null;
    const real = r.status !== "crash" && isNum(r.metric);
    const cx = X(r.run), cy = pin ? m.t + ph : clampY(Y(p.y));
    const dot = marker(k, cx, cy, p.small);
    dot.setAttribute("data-kind", k);
    if (p.small) dot.setAttribute("data-small", "1");
    const hit = svg("circle", { class: "hit", cx, cy, r: 9, fill: "transparent", style: "cursor:pointer" });
    const show = () => {
      const sm = numSamples(r), c = confInfo(r, a), sp = shownPair(r, a);
      // filter: replaceChildren() would print a null as the text "null"
      tip.replaceChildren(...[
        h("div", {}, h("b", {}, "#" + r.run), " · ", KIND_LABEL[k] || k, real ? " · " : null, real ? h("b", {}, fmt(r.metric) + unit) : null),
        !sp ? null
          : sp.refKind !== "pairs" ? h("div", {}, `vs ${REF_LABEL[sp.refKind]} ${fmt(sp.ref)}${unit}: ${gainText(sp.gain)}`)
          : k === "neutral" ? h("div", {}, "not measurably worse than HEAD alongside" + (sp.n ? ` (${pairsText(sp.n)})` : ""))
          : h("div", {}, `${gainText(sp.gain)} than HEAD alongside` + (sp.n ? ` · median of ${pairsText(sp.n)}` : "")),
        a.levelAfter.has(r) ? h("div", {}, "level after this run: " + levelText(a.levelAfter.get(r))) : null,
        sm.length > 1 && !(sp && sp.refKind === "pairs") ? h("div", {}, `samples ${fmt(Math.min(...sm))} – ${fmt(Math.max(...sm))} (${sm.length})`) : null,
        c && c.text !== "—" ? h("div", { class: "tipconf" }, c.text) : null,
        c && c.luck ? h("div", { class: "tipluck" }, c.luck) : null,
        h("div", {}, String(r.description ?? "")),
        r.note ? h("div", {}, String(r.note)) : null].filter(Boolean));
      tip.style.display = "block";
      const bw = box.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = cx + 8 + 12; if (left + tw > bw - 4) left = cx + 8 - tw - 12;
      let top = cy + 8 - th - 8; if (top < 2) top = cy + 8 + 12;
      tip.style.left = Math.max(4, left) + "px"; tip.style.top = top + "px";
    };
    hit.addEventListener("mouseenter", show);
    hit.addEventListener("click", show);
    hit.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    s.append(dot, hit);
  }
  box.append(s);
}

function renderTable(a) {
  const { runs, baseRun, kind } = a;
  const tbody = h("tbody");
  for (const r of [...runs].reverse()) {
    const key = r.segment + ":" + r.run; // run numbers restart in each segment
    const open = expanded.has(key);
    const k = kind.get(r);
    const real = r.status !== "crash" && isNum(r.metric); // crashes may carry a placeholder metric
    const p = shownPair(r, a); // keeps and unconfirmed keeps: candidate against HEAD measured alongside
    const c = confInfo(r, a);
    let vsCell;
    if (!p) vsCell = h("td", { class: "num vs" }, "—");
    else if (p.refKind === "pairs") {
      // v0.2.2: the median difference of the pairs. A simplification is not shown as a gain.
      vsCell = k === "neutral"
        ? h("td", { class: "num vs" }, h("div", {}, "no measurable loss"), h("div", { class: "cmp" }, pairsText(p.n)))
        : h("td", { class: "num vs" }, h("div", { class: gainClass(p.gain) }, gainText(p.gain)), h("div", { class: "cmp" }, p.n ? "median of " + pairsText(p.n) : ""));
    } else {
      vsCell = h("td", { class: "num vs" },
        // A neutral keep isn't judged on gain, so it gets no colour.
        h("div", { class: k === "neutral" ? "" : gainClass(p.gain) }, gainText(p.gain)),
        h("div", { class: "cmp" }, `${fmt(p.cand)} vs ${fmt(p.ref)}` + (p.refKind === "paired" ? "" : ` (${REF_LABEL[p.refKind]})`)));
    }
    const row = h("tr", { class: "row" + (open ? " open" : ""), "data-run": String(r.run) },
      h("td", { class: "num" }, h("span", { class: "tog" }, "▸"), " ", String(r.run)),
      h("td", {}, h("span", { class: "badge s-" + k }, KIND_LABEL[k] || k)),
      h("td", { class: "num" }, real ? fmt(r.metric) : "—"),
      vsCell,
      h("td", { class: "num level" }, a.levelAfter.has(r) ? levelText(a.levelAfter.get(r)) : "—"), // only kept runs move the level
      h("td", { class: "num conf " + (c ? c.cls : ""), title: c && c.title }, c ? c.text : "—"),
      h("td", { class: "desc" }, String(r.description ?? ""), k === "unconfirmed" ? h("div", { class: "rownote" }, String(r.note)) : null),
      h("td", { class: "commit" }, r.commit ? String(r.commit) : "—"));
    const detail = h("tr", { class: "detail" }, h("td", { colspan: 8 }, renderDetail(r, a)));
    detail.hidden = !open;
    row.addEventListener("click", () => {
      if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
      detail.hidden = !expanded.has(key);
      row.classList.toggle("open", expanded.has(key));
    });
    tbody.append(row, detail);
  }
  const head = h("thead", {}, h("tr", {},
    h("th", { class: "num" }, "#"), h("th", {}, "Status"),
    h("th", { class: "num", title: "median of the run's samples, as measured at the time; not comparable between runs far apart" }, "Metric"),
    h("th", { class: "num", title: "kept and not-confirmed runs: the candidate against HEAD measured right alongside it, as the median difference of the HEAD/candidate pairs (older entries: candidate median vs HEAD median)" }, "vs HEAD alongside"),
    h("th", { class: "num", title: `level after this run: the metric in % of the baseline (100%); each confirmed keep multiplies it by candidate ÷ HEAD measured alongside. ${a.dir === "higher" ? "Higher" : "Lower"} is better. Simplifications don't move it.` }, "Level"),
    h("th", { class: "num", title: "the plugin's decision. p = the chance of a result this clear if the change did nothing (exact paired test); small is good. Hover a cell for plain words. Older entries show gain ÷ noise." }, "Confirmed?"),
    h("th", {}, "Description"), h("th", {}, "Commit")));
  return h("div", { class: "card tablewrap" }, h("table", { class: "runs" }, head, tbody));
}

function kvList(obj, round) {
  const dl = h("dl", { class: "kv" });
  for (const [k, v] of Object.entries(obj)) dl.append(h("dt", {}, k), h("dd", {}, valText(v, round)));
  return dl;
}
// The pairs of one run as a small table: HEAD, candidate, difference per pair, in
// measurement order, and their median. `pairs` are [head, candidate].
function pairTable(pairs, a, id) {
  const diffs = pairs.map((q) => pairGain(q, a.dir));
  const usable = diffs.filter(isNum);
  const body = h("tbody", {}, pairs.map((q, i) => h("tr", {},
    h("td", { class: "num" }, String(i + 1)), h("td", { class: "num" }, fmt(q[0])), h("td", { class: "num" }, fmt(q[1])),
    h("td", { class: "num " + gainClass(diffs[i]) }, gainText(diffs[i])))));
  if (usable.length > 1) body.append(h("tr", { class: "med" }, h("td", { colspan: 3 }, "median difference"), h("td", { class: "num" }, gainText(median(usable)))));
  return h("div", { class: "pairwrap" }, h("table", { class: "pairs", id },
    h("thead", {}, h("tr", {}, h("th", { class: "num" }, "pair"), h("th", { class: "num" }, "HEAD"), h("th", { class: "num" }, "candidate"), h("th", { class: "num" }, "difference"))),
    body));
}
function renderDetail(r, a) {
  const wrap = h("div");
  const unit = a.config.metric_unit ? " " + a.config.metric_unit : "";
  const asi = r.asi && typeof r.asi === "object" ? r.asi : null;
  const metrics = r.metrics && typeof r.metrics === "object" ? r.metrics : null;
  if (r.note) wrap.append(h("div", { class: "kvh" }, "Note"), h("div", { class: "notetext", style: "white-space:pre-wrap;word-break:break-word" }, String(r.note)));
  // Measurement: what the plugin measured for this run.
  const meas = {};
  const sm = numSamples(r), cs = numList(r.current_samples);
  const p = a.pair.get(r), k = a.kind.get(r);
  const c = confInfo(r, a);
  const decided = k === "keep" || k === "neutral" || k === "unconfirmed";
  const pairs = p && p.refKind === "pairs" ? p : null;
  if (pairs) {
    // v0.2.2: the paired result first; the absolute medians are only "as measured then".
    if (decided) {
      meas.result = k === "neutral"
        ? `kept as a simplification: not measurably worse than HEAD (median difference ${gainText(p.gain)}; counted as no change)`
        : `${gainText(p.gain)} than HEAD measured alongside` + (p.n ? ` (median of ${pairsText(p.n)})` : "");
      if (p.p != null) meas.test = `${pText(p.p)} (exact one-sided paired test) · ${luckText(p.p)}`;
      else meas.test = SLOW_TAG;
      if (c && k !== "neutral") meas.decision = c.text;
    }
    if (isNum(r.metric)) meas["candidate, median"] = fmt(r.metric) + unit;
    if (isNum(r.vs)) meas["HEAD alongside, median"] = fmt(r.vs) + unit;
  } else {
    if (isNum(r.first_metric)) meas["first measurement"] = fmt(r.first_metric) + unit;
    if (sm.length) meas[cs.length ? "candidate samples" : "samples"] = sm.map(fmt).join(", ") + unit;
    if (cs.length) meas["HEAD alongside samples"] = cs.map(fmt).join(", ") + unit;
    // For an unconfirmed keep (logged as discard) the second measurement did not confirm anything.
    if ((isNum(r.first_metric) || cs.length) && isNum(r.metric)) meas[r.status === "keep" ? "confirmed value" : "re-measured value"] = fmt(r.metric) + unit + " (median)";
    if (p && (r.status === "keep" || p.refKind !== "previous")) {
      const what = { paired: "HEAD measured alongside, median", logged: "current as logged at that time", previous: "the keep before" }[p.refKind];
      meas["compared with"] = `${fmt(p.ref)}${unit} (${what})`;
      meas.result = gainText(p.gain);
    }
  }
  if (a.levelAfter.has(r) && r !== a.baseRun) meas["level after"] = levelText(a.levelAfter.get(r)) + " of the baseline";
  if (isNum(r.noise)) meas.noise = fmt(r.noise);
  if (!pairs && c && c.text !== "—") meas.confidence = c.text;
  if (Object.keys(meas).length) wrap.append(h("div", { class: "kvh" }, "Measurement"), kvList(meas));
  if (pairs) {
    if (p.pairs.length) wrap.append(
      h("div", { class: "kvh" }, `Pairs the decision was made on (${a.config.metric_unit ? a.config.metric_unit + ", " : ""}in measurement order)`),
      pairTable(p.pairs, a, "pairs-" + r.run));
    if (p.look.length) wrap.append(
      h("div", { class: "kvh", title: "The rough first look from autoresearch_run. These pairs led to the keep proposal, so they are never part of the decision." }, "First look (not part of the decision)"),
      pairTable(p.look, a, "look-" + r.run));
  } else {
    // A run that was only looked at (a plain discard) still carries its first-look pairs.
    const look = pairList(r.look_pairs);
    if (look.length) wrap.append(h("div", { class: "kvh" }, "First look (HEAD/candidate pairs)"), pairTable(look, a, "look-" + r.run));
  }
  if (metrics && Object.keys(metrics).length) wrap.append(h("div", { class: "kvh" }, "Metrics"), kvList(metrics, true));
  if (asi && Object.keys(asi).length) wrap.append(h("div", { class: "kvh" }, "Notes"), kvList(asi));
  if (r.timestamp) wrap.append(h("div", { class: "kvh" }, String(r.timestamp)));
  if (!wrap.childNodes.length) wrap.append(h("span", { class: "sub" }, "No notes"));
  return wrap;
}

// ---------- live connection ----------
// The running indicator costs one small text + class update per second, and nothing at all
// while the tab is hidden (a tester suspected the page of adding load during benchmarks).
let tickTimer = null, runStart = null, shownElapsed = "";
function tick() {
  const secs = Math.max(0, Math.floor((Date.now() - runStart) / 1000));
  const text = mmss(secs * 1000);
  if (text === shownElapsed) return; // the timer fired twice within one second: nothing to do
  shownElapsed = text;
  $("elapsed").textContent = text;
  $("beat").classList.toggle("dim", secs % 2 === 1);
}
function syncTicker() {
  clearInterval(tickTimer); tickTimer = null;
  if (runStart === null || document.hidden) return;
  tick();
  tickTimer = setInterval(tick, 1000);
}
function setStatus(st) {
  const el = $("running");
  const running = Boolean(st && st.running);
  el.hidden = !running;
  runStart = running ? (isNum(st.startedAt) ? st.startedAt : Date.now()) : null;
  if (running) {
    $("runcmd").textContent = st.command ? String(st.command) : "running";
    $("runcmd").title = st.command ? String(st.command) : "";
  }
  shownElapsed = "";
  syncTicker();
}
document.addEventListener("visibilitychange", () => {
  syncTicker();
  if (document.hidden) return;
  if (renderPending) requestRender();
  else if (chartArg && $("chart")) drawChart(chartArg); // the window may have been resized meanwhile
});
function setConn(state) {
  $("conn").className = "pill " + state;
  $("conntext").textContent = state;
}

function connect() {
  const es = new EventSource("/events");
  es.onopen = () => { setConn("live"); loadLog(); }; // fires on every (re)connect
  es.onerror = () => {
    setConn(es.readyState === EventSource.CLOSED ? "offline" : "reconnecting");
    // Browsers give up on some errors (e.g. server returned non-200); retry manually then.
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 3000);
  };
  es.addEventListener("log", () => loadLog());
  es.addEventListener("status", (ev) => {
    try { setStatus(JSON.parse(ev.data)); } catch { /* ignore malformed status */ }
  });
}

// Redraw the chart at the real pixel width (not a scaled viewBox) so tick labels stay readable.
// drawChart() itself ignores calls where neither the width nor the data changed.
new ResizeObserver(() => {
  if (chartArg && $("chart") && !document.hidden) drawChart(chartArg);
}).observe(document.querySelector("main"));
loadLog();
connect();
</script>
</body>
